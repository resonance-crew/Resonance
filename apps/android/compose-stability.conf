// Types the Compose compiler may treat as stable (app and core:design read this file; see their
// build.gradle.kts). core:kit and resonance-geometry are built without the Compose compiler, so
// without this every type of theirs reads as unstable — compared by identity, never by value — and a
// row or a card rebuilt with the same values (a new ThreadRow on every snapshot, a FeedCard mapped
// again) recomposes all the same.
//
// Only immutable values belong here: classes of `val`s holding immutable values, never changed after
// they are made. A class with state of its own (Outbox, MessageHistory, the PRNG) stays out.

// The /api/v1 models, generated as data classes of vals (core/kit/build/generated/openapi).
com.resonance.api.models.*

// The chat's values (core/kit/.../chat).
com.resonance.kit.chat.ChatMessage
com.resonance.kit.chat.ReplyQuote
com.resonance.kit.chat.LinkPreview
com.resonance.kit.chat.ChatImage
com.resonance.kit.chat.ThreadRow
com.resonance.kit.chat.SharedCard
com.resonance.kit.chat.Carried
com.resonance.kit.chat.Carried.*
com.resonance.kit.chat.SearchHit
com.resonance.kit.chat.SearchSnippet
com.resonance.kit.chat.Linkify.Link
com.resonance.kit.chat.PictureBox.Size
com.resonance.kit.api.MessagingApi.Note

// A story's parsed blocks and type (core/kit/.../story).
com.resonance.kit.story.StoryBlock
com.resonance.kit.story.StoryBlock.*
com.resonance.kit.story.InlineRun
com.resonance.kit.story.StoryText
com.resonance.kit.story.StoryLink
com.resonance.kit.story.StoryLink.*

// The geometry's options and results (native/geometry/kotlin).
com.resonance.geometry.WobRectOptions
com.resonance.geometry.WobCircleOptions
com.resonance.geometry.WobLoopOptions
com.resonance.geometry.WobTabRectOptions
com.resonance.geometry.SegValue
com.resonance.geometry.SegValue.*
com.resonance.geometry.CornerRadii
com.resonance.geometry.PathCommand
com.resonance.geometry.PathCommand.*
com.resonance.geometry.Pt
com.resonance.geometry.Rect
com.resonance.geometry.MapCamera

// Read-only collections: what is handed down is never changed in place afterwards (a list is
// replaced, not mutated, when its contents change), so equal contents are equal.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
// A range of text (a link's, a search match's): two vals.
kotlin.ranges.IntRange
