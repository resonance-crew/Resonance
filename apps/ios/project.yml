# XcodeGen spec for the Resonance iOS app. Generate the project with:
#   cd apps/ios && xcodegen generate
# (the .xcodeproj is not committed; see apps/README.md)
name: Resonance
options:
  bundleIdPrefix: com.resonance
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # The story editor (native/editor/dist/editor.html) and the mascot island (native/mascots/dist/mascots.html)
  # are build output the repo does not keep; without them the spec's source entries below would stop
  # generation with an opaque "missing source" error.
  preGenCommand: 'test -s ../../native/editor/dist/editor.html || { echo "error: native/editor/dist/editor.html is missing or empty: the story editor would not load. Run npm run native:editor (or npm run apps:generate) in the repository root first." >&2; exit 1; }; test -s ../../native/mascots/dist/mascots.html || { echo "error: native/mascots/dist/mascots.html is missing or empty: the paper puppets would not load. Run npm run native:mascots (or npm run apps:generate) in the repository root first." >&2; exit 1; }'
packages:
  DesignSystem:
    path: Packages/DesignSystem
  ResonanceKit:
    path: Packages/ResonanceKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
targets:
  Resonance:
    type: application
    platform: iOS
    sources:
      - path: Resonance
      # Shared with Android: subset fonts (scripts/native/subset-fonts.py).
      - path: ../shared/fonts
        type: folder
        buildPhase: resources
      # The web's message catalogs, bundled as they are (see L10n.swift).
      - path: ../../src/messages/en.json
        buildPhase: resources
      - path: ../../src/messages/zh-TW.json
        buildPhase: resources
      # The story editor island (npm run native:editor → native/editor/dist).
      - path: ../../native/editor/dist/editor.html
        buildPhase: resources
      # The paper puppets' island (round 19: npm run native:mascots → native/mascots/dist).
      - path: ../../native/mascots/dist/mascots.html
        buildPhase: resources
      # The 小紙團 stickers (round 22): the web's catalog and files as they are (public/stickers →
      # the bundle's stickers/), drawn from here; a sticker this build doesn't carry is read from the site.
      - path: ../../public/stickers
        type: folder
        buildPhase: resources
    # The editor above is build output the repo does not keep. Xcode's own answer to a missing
    # resource is "Build input file cannot be found", which says nothing about npm; this says it first.
    preBuildScripts:
      - name: Require the story editor
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../native/editor/dist/editor.html
        script: |
          editor="${SRCROOT}/../../native/editor/dist/editor.html"
          if [ -s "$editor" ]; then exit 0; fi
          echo "error: native/editor/dist/editor.html is missing or empty: the writer's story editor would not load. Run 'npm run native:editor' (or 'npm run apps:generate') in the repository root first."
          exit 1
      - name: Require the mascot island
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../../native/mascots/dist/mascots.html
        script: |
          island="${SRCROOT}/../../native/mascots/dist/mascots.html"
          if [ -s "$island" ]; then exit 0; fi
          echo "error: native/mascots/dist/mascots.html is missing or empty: the paper puppets would not load. Run 'npm run native:mascots' (or 'npm run apps:generate') in the repository root first."
          exit 1
    dependencies:
      - package: DesignSystem
      - package: ResonanceKit
        product: ResonanceKit
      - package: ResonanceKit
        product: ResonanceAPI
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        # RESONANCE_BUNDLE_SUFFIX (empty) and RESONANCE_MAC_ENTITLEMENTS let a local Mac run stand beside
        # the App Store copy on this Mac: its own bundle id and container, ad-hoc signed with entitlements
        # that need no profile (apps/README.md, "The Mac app").
        RESONANCE_BUNDLE_SUFFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.resonance.stories$(RESONANCE_BUNDLE_SUFFIX)
        PRODUCT_NAME: Resonance
        MARKETING_VERSION: "2.3.0"
        CURRENT_PROJECT_VERSION: "14"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # iPhone and iPad (round 5: the iPad layouts — side rail, two-pane Messages, the feed grid).
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac app is the iPad's layout at Mac Catalyst's 77 % ("Scale Interface to Match iPad"; round 21,
        # the owner's call): drawn 1:1 ("Optimize Interface for Mac", family 6) everything read about 30 %
        # larger than the Mac's own apps. A story's own words are drawn larger there by the inverse
        # (TextScale.macReadingBoost), so a story still reads at 17 pt (apps/README.md, "The Mac app").
        CODE_SIGN_ENTITLEMENTS: Resonance/Resonance.entitlements
        # The Mac app (Mac Catalyst, the owner's 2026-10-29 call): the same bundle id as the iPhone and
        # iPad app (one App Store record, universal purchase), in the Mac's sandbox.
        SUPPORTS_MACCATALYST: "YES"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        RESONANCE_MAC_ENTITLEMENTS: Resonance/Resonance-Mac.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": $(RESONANCE_MAC_ENTITLEMENTS)
        # Device builds sign automatically with the team signed into Xcode
        # (archives: xcodebuild … -allowProvisioningUpdates). Simulator builds
        # sign ad hoc ("Sign to Run Locally"), and Firebase Auth gets the
        # keychain access it stores the session in.
        DEVELOPMENT_TEAM: V7H59QAJPL
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: Resonance/Info.plist
      properties:
        CFBundleDisplayName: Resonance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hant]
        # The paper and the icon's waves, centred; LaunchCover.swift draws the same and hands off to
        # the first screen. The asset's dark variant is the night paper: the system draws the launch
        # screen in its own appearance (Settings → 外觀 is the app's, laid on its scene once it runs).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iPhone stays portrait; an iPad turns every way (no UIRequiresFullScreen: its windows resize,
        # and every layout decides from the measured width — WindowLayout).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # The Mac App Store files a Mac app under a category.
        LSApplicationCategoryType: public.app-category.social-networking
        # Push: the app hands FCM the APNs token itself (PushCenter.swift), no swizzling.
        FirebaseAppDelegateProxyEnabled: false
        # Google Sign-In: OAuth client and its redirect scheme (GoogleService-Info.plist).
        GIDClientID: 1090298219401-pgd3sh80h9ukvf4l564dpvegebi2s8o7.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.googleusercontent.apps.1090298219401-pgd3sh80h9ukvf4l564dpvegebi2s8o7]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A card's share sheet offers Save Image (its 1080 × 1920 picture): the system's add-only
        # photo prompt. The words are share.image.photoAccess, localized by Resources/*.lproj/
        # InfoPlist.strings (scripts/apps/l10n.ts, which checks this English one against the catalog).
        NSPhotoLibraryAddUsageDescription: "Saves share images to your photo library"
        # Instagram Stories (InstagramStories.swift): asked whether instagram-stories:// opens.
        LSApplicationQueriesSchemes: [instagram-stories]
  ResonanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ResonanceTests]
    dependencies:
      - target: Resonance
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Resonance.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Resonance
schemes:
  Resonance:
    build:
      targets:
        Resonance: all
        ResonanceTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-emulator YES": false
    test:
      config: Debug
      targets: [ResonanceTests]
