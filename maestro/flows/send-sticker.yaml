# alice opens her thread with bob, opens the sticker panel (☺, 貼圖) and taps 摺摺's 心暖暖 once: one tap sends it
# (round 23 — no preview), the sticker stands in the thread, no bubble, and the send completes.
appId: com.resonance.stories
name: send-sticker
tags:
  - chat
  - stickers
---
- runFlow:
    file: common/launch.yaml
    env:
      ACCOUNT: alice
      ROUTE: /messages/bob
- extendedWaitUntil:
    visible: 你的信讓我想起我自己的十年前。
    timeout: 30000
# ☺ is there while the field holds no words; the panel takes the keyboard's place.
- tapOn: 貼圖
- extendedWaitUntil:
    visible: 心暖暖
    timeout: 10000
# One tap on the cell (named by its name) sends it; the panel stays.
- tapOn: 心暖暖
- extendedWaitUntil:
    visible: 貼圖：心暖暖
    timeout: 10000
- extendedWaitUntil:
    notVisible: 傳送中⋯
    timeout: 15000
- takeScreenshot: send-sticker
