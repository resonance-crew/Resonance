# Replying to two different stickers in a row (escaped bug #10, round 24: the reply row kept showing the first —
# iOS's @State, Android's produceState not keyed). alice sends 心暖暖 to bob, holds his 謝謝 and answers it (the reply
# row names 貼圖：謝謝), then holds her own 心暖暖 and answers that instead: the row now names 貼圖：心暖暖 and no longer
# 謝謝. She sends words with it; her bubble quotes the second sticker.
# Each sticker is named 貼圖：<name> for VoiceOver and TalkBack, in the thread and in the reply row alike
# (messages.stickerLabel), so a name standing twice is the thread's and the row's.
appId: com.resonance.stories
name: sticker-replies
tags:
  - chat
  - stickers
  - composer
  - tablet
---
- runFlow:
    file: common/launch.yaml
    env:
      ACCOUNT: alice
      ROUTE: /messages/bob
- extendedWaitUntil:
    visible: 你的信讓我想起我自己的十年前。
    timeout: 30000
- assertVisible: 貼圖：謝謝
- tapOn: 貼圖
- extendedWaitUntil:
    visible: 心暖暖
    timeout: 10000
- tapOn: 心暖暖
- extendedWaitUntil:
    visible: 貼圖：心暖暖
    timeout: 10000
- extendedWaitUntil:
    notVisible: 傳送中⋯
    timeout: 15000
# The first: bob's 謝謝. Sending 心暖暖 took the thread to its end, the panel still open, and 謝謝 is far above:
# scrolled back into the middle of the thread before it is held (a hold at the screen's edge or under the
# header lands on something else).
- scrollUntilVisible:
    element: 貼圖：謝謝
    direction: UP
    centerElement: true
    timeout: 20000
- longPressOn: 貼圖：謝謝
- extendedWaitUntil:
    visible: 回覆
    timeout: 15000
- tapOn: 回覆
- extendedWaitUntil:
    visible: 回覆 bob
    timeout: 5000
- runFlow:
    file: common/reply-row.yaml
    env:
      NAMES: 貼圖：謝謝
      NOT: 貼圖：心暖暖
      WHOM: 回覆 bob
- takeScreenshot: sticker-replies-first
# The second, straight after: alice's own 心暖暖. The row must follow it. Answering took the thread to its end
# again and the reply row grew the capsule over the newest message (心暖暖 is on screen, under the row): brought
# up into the middle before it is held.
- scrollUntilVisible:
    element: 貼圖：心暖暖
    direction: DOWN
    centerElement: true
    timeout: 20000
- longPressOn: 貼圖：心暖暖
- extendedWaitUntil:
    visible: 回覆
    timeout: 15000
- tapOn: 回覆
- extendedWaitUntil:
    visible: 回覆自己
    timeout: 5000
- runFlow:
    file: common/reply-row.yaml
    env:
      NAMES: 貼圖：心暖暖
      NOT: 貼圖：謝謝
      WHOM: 回覆自己
- takeScreenshot: sticker-replies-second
- tapOn: 與 bob 的對話|想說的話⋯
- inputText: 兩張都可愛 Maestro
- tapOn: 送出
- extendedWaitUntil:
    visible: 兩張都可愛 Maestro
    timeout: 10000
- extendedWaitUntil:
    notVisible: 傳送中⋯
    timeout: 15000
- takeScreenshot: sticker-replies
