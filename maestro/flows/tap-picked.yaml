# alice reads her own 搬家後的第一個安靜夜晚 (round 29 §S7): the sentences her readers picked after 共振 wear a faint wash,
# and who picked each stands beside it — after the sentence on a phone, in the right margin on a tablet. The seed has
# gus and bob on the first passage, carol on the second, no one on the quote. She presses the first sentence's faces:
# a centred dialog of the people who picked that sentence (tap-picked) — gus among them — and she closes it with its
# 關閉 (tap-picked-close: the backdrop is named 關閉 too). Her list at the story's end is untouched (tap.yaml, the
# release screenshots' taps-author-list). Nothing is written: the seed is as it was.
appId: com.resonance.stories
name: tap-picked
tags:
  - card
  - tablet
---
- runFlow:
    file: common/launch.yaml
    env:
      ACCOUNT: alice
      ROUTE: /card/rich-story
- extendedWaitUntil:
    visible: 搬家後的第一個安靜夜晚
    timeout: 30000
- scrollUntilVisible:
    element:
      id: passage-faces-0
    direction: DOWN
    timeout: 20000
- tapOn:
    id: passage-faces-0
- extendedWaitUntil:
    visible:
      id: tap-picked
    timeout: 10000
- extendedWaitUntil:
    visible: gus
    timeout: 15000
- takeScreenshot: tap-picked
- tapOn:
    id: tap-picked-close
- extendedWaitUntil:
    notVisible:
      id: tap-picked
    timeout: 10000
- assertVisible:
    id: passage-faces-0
