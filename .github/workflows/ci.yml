name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the jobs check code and need no write access to the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Everything the apps take from the web that git tracks must match it: tokens, strings, icons,
      # reactions, the sticker catalog, the OpenAPI document (apps:generate less its git-ignored builds).
      - run: npm run apps:generate:tracked
      - name: Generated output is current
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then echo "Generated files not committed:"; echo "$untracked"; exit 1; fi

  # The commits this push or pull request brings: a UI commit names its screens (`Visual:`), a
  # data-layer change comes with a test (scripts/ci/commitRules.ts).
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commit rules
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run -s rules:commits -- "$BASE..$HEAD_SHA"

  # Firestore rules + Admin SDK purge suites against the local emulators.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # An exact version: the CLI runs the suite, so it is pinned like the lockfile's packages.
      - run: npm install -g firebase-tools@15.26.0
      - run: npm run test:emulator

  # Phase 3 of the middleware decouple: the PostgreSQL suites (`*.pg.test.ts`, and the PostgreSQL
  # cases of the others) on a throwaway pgvector database. Without PG_TEST_URL, `npm test` skips them.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resonance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/resonance_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run src/server/infra/postgres src/server/app/replicate.test.ts src/server/app/anonymousBlocks.pg.test.ts src/server/app/shadow.test.ts
