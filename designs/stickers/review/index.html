<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小紙團 stickers review</title>
<!--
  The sticker review: every sticker in public/stickers as clients will play it (two plays, then its key frame), at
  128 and 144 px on the day paper and the night paper, its key frame (the thumb), its size and length, and a few in a
  mock thread. Open it from disk (file://) or any static server at the repo root; the list is data.js, which
  scripts/stickers/catalog.ts writes after every render. "Replay" restarts every animation.
-->
<style>
  :root {
    --day: oklch(96.5% 0.015 75);
    --night: oklch(20.5% 0.0084 62);
    --ink: oklch(29% 0.018 60);
    --ink-soft: oklch(48% 0.02 60);
    --night-ink: oklch(92% 0.015 80);
    --pen: oklch(80% 0.02 70);
    --accent: oklch(62% 0.14 45);
    --bubble-day: oklch(99% 0.006 80);
    --bubble-mine: oklch(90% 0.05 50);
    --bubble-night: oklch(28% 0.012 60);
    --bubble-mine-night: oklch(38% 0.05 45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--day); color: var(--ink); font: 15px/1.5 -apple-system, "Helvetica Neue", "PingFang TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center; padding: 12px 20px; background: var(--day); border-bottom: 1px solid var(--pen); }
  header h1 { margin: 0; font-size: 18px; }
  header .sum { color: var(--ink-soft); font-size: 13px; }
  button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
  main { padding: 8px 20px 60px; }
  .pack { margin-top: 28px; }
  .pack h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 17px; }
  .pack h2 img { width: 48px; height: 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 14px; }
  .st { border: 1.5px solid var(--pen); border-radius: 16px; overflow: hidden; }
  .st .row { display: flex; }
  .st .pane { flex: 1; display: flex; align-items: flex-end; justify-content: space-around; gap: 6px; padding: 12px 8px; }
  .st .pane.day { background: var(--day); }
  .st .pane.night { background: var(--night); }
  .st .pane img.a128 { width: 128px; height: 128px; }
  .st .pane img.a144 { width: 144px; height: 144px; }
  .st .meta { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1.5px solid var(--pen); background: var(--bubble-day); font-size: 13px; }
  .st .meta img { width: 64px; height: 64px; border-radius: 8px; background: repeating-conic-gradient(oklch(92% 0.01 80) 0 25%, transparent 0 50%) 0 0 / 12px 12px; }
  .st .meta .name { font-weight: 600; font-size: 14px; }
  .st .meta .nums { color: var(--ink-soft); }
  .st .meta .warn { color: var(--accent); font-weight: 600; }
  .threads { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
  .thread { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 420px; }
  .thread.day { background: var(--day); border: 1.5px solid var(--pen); }
  .thread.night { background: var(--night); color: var(--night-ink); }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 16px; background: var(--bubble-day); border: 1.5px solid var(--pen); }
  .night .msg { background: var(--bubble-night); border-color: oklch(40% 0.015 60); }
  .msg.mine { align-self: flex-end; background: var(--bubble-mine); border-color: oklch(80% 0.06 50); }
  .night .msg.mine { background: var(--bubble-mine-night); border-color: oklch(48% 0.06 45); }
  .sticker { width: 128px; height: 128px; }
  .sticker.mine { align-self: flex-end; }
  .placeholder { opacity: 0.55; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .threads { grid-template-columns: 1fr; } .st .pane img.a144 { display: none; } }
</style>
<script src="data.js"></script>
</head>
<body>
<header>
  <h1>小紙團 stickers</h1>
  <span class="sum" id="sum"></span>
  <button id="replay" type="button">Replay</button>
</header>
<main>
  <section class="threads" id="threads"></section>
  <div id="packs"></div>
</main>
<script>
  const BASE = '../../../public/stickers/';
  const packs = window.STICKERS || [];
  let replay = 0;
  const src = (pack, file, v) => `${BASE}${pack}/${file}?v=${v || 0}&r=${replay}`;
  const kb = (n) => (n / 1024).toFixed(1) + ' KB';
  function anim(pack, st, cls) {
    const im = document.createElement('img');
    im.className = cls;
    im.alt = st.name['zh-TW'];
    im.dataset.src = `${pack}/${st.id}.webp`;
    im.dataset.v = st.v || 0;
    im.src = src(pack, `${st.id}.webp`, st.v);
    return im;
  }
  function render() {
    const root = document.getElementById('packs');
    root.textContent = '';
    let drawn = 0, total = 0, bytes = 0;
    for (const p of packs) {
      const sec = document.createElement('section');
      sec.className = 'pack';
      const h = document.createElement('h2');
      h.innerHTML = `<img alt="" src="${src(p.id, 'icon.webp', p.icon && p.icon.v)}"> ${p.name['zh-TW']} ${p.name.en} <span class="sum">${p.id}</span>`;
      sec.append(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      for (const st of p.stickers) {
        total++;
        const still = !st.frames || st.frames <= 1;
        if (!still) { drawn++; bytes += st.bytes || 0; }
        const card = document.createElement('div');
        card.className = 'st' + (still ? ' placeholder' : '');
        const row = document.createElement('div');
        row.className = 'row';
        for (const paper of ['day', 'night']) {
          const pane = document.createElement('div');
          pane.className = `pane ${paper}`;
          pane.append(anim(p.id, st, 'a128'), anim(p.id, st, 'a144'));
          row.append(pane);
        }
        const meta = document.createElement('div');
        meta.className = 'meta';
        const over = (st.bytes || 0) > 120 * 1024;
        meta.innerHTML = `<img alt="thumb" src="${src(p.id, st.id + '.thumb.webp', st.v)}">
          <div><div class="name">${st.name['zh-TW']} · ${st.name.en}</div>
          <div class="nums">${p.id}/${st.id} · ${still ? 'placeholder (still)' : `${st.frames} frames · ${(st.durationMs / 1000).toFixed(2)} s · plays twice`}
          · <span class="${over ? 'warn' : ''}">${kb(st.bytes || 0)}</span> · thumb ${kb(st.thumbBytes || 0)}</div></div>`;
        card.append(row, meta);
        grid.append(card);
      }
      sec.append(grid);
      root.append(sec);
    }
    document.getElementById('sum').textContent = `${drawn} of ${total} drawn · ${kb(bytes)} in all`;
    renderThreads();
  }
  function renderThreads() {
    const root = document.getElementById('threads');
    root.textContent = '';
    const drawn = packs.flatMap(p => p.stickers.filter(s => s.frames > 1).map(s => [p.id, s]));
    const pick = (i) => drawn.length ? drawn[i % drawn.length] : null;
    const script = [
      { me: false, text: '今天的故事寫完了，好長一篇' },
      { me: true, sticker: 0 },
      { me: false, text: '謝謝你讀到最後 🙂' },
      { me: false, sticker: 1 },
      { me: true, text: '我會好好收著' },
      { me: true, sticker: 2 },
    ];
    for (const paper of ['day', 'night']) {
      const t = document.createElement('div');
      t.className = `thread ${paper}`;
      for (const m of script) {
        if (m.text) {
          const b = document.createElement('div');
          b.className = 'msg' + (m.me ? ' mine' : '');
          b.textContent = m.text;
          t.append(b);
        } else {
          const s = pick(m.sticker);
          if (!s) continue;
          const im = anim(s[0], s[1], 'sticker' + (m.me ? ' mine' : ''));
          t.append(im);
        }
      }
      root.append(t);
    }
  }
  document.getElementById('replay').addEventListener('click', () => { replay++; render(); });
  render();
</script>
</body>
</html>
