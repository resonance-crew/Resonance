<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing film palettes</title>
<!--
  The landing film's art-direction mock: one paper landscape (the same seeded place) cut at six times of day, each
  a sky wash + seven paper layers and the sea, whose colours come from one formula (depth → OKLCH ramp from the
  time's haze to its ink, plus each layer's own paper at mid depth), the paper finish by depth (far: flat cut; mid:
  cut with a pale cut edge; near: torn with a fibre rim, mottle and specks, a pencil line on the ground), the light
  (sun / moon disc with paper halos, a rim light on the puppets at low sun, lit windows, a lighthouse, pinprick
  stars) and the particles (paper birds, the ≋ wind, lanterns, fibres). Puppets are laid from their rig parts at rest.

  ?view=grid (default): the six frames, 3 × 2, with swatches.   ?view=dusk: one dusk frame filling the window.
  Procedural and seeded: the same seed, the same paper. The geometry is a port of designs/stickers/kit/paper.ts,
  the filters its recipes rescaled for a landscape.
-->
<style>
  :root { --paper: oklch(96.5% 0.015 75); --ink: oklch(26% 0.03 60); --muted: oklch(52% 0.04 70); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 "DM Sans", system-ui, sans-serif; }
  header { padding: 28px 40px 4px; }
  header h1 { font: 600 22px/1.2 "Playfair Display", Georgia, serif; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 22px; padding: 22px 40px 36px; }
  figure { margin: 0; }
  .frame svg { display: block; width: 100%; height: auto; border-radius: 10px; }
  figcaption { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  figcaption b { font: 600 15px/1 "Playfair Display", Georgia, serif; min-width: 150px; }
  .sw { display: flex; flex: 1; height: 16px; border-radius: 4px; overflow: hidden; }
  .sw i { flex: 1; }
  .sw i.sky { flex: 0.6; }
  .sw i.gap { flex: 0.25; background: var(--paper); }
  body.single { background: #000; }
  body.single header, body.single figcaption { display: none; }
  body.single .grid { display: block; padding: 0; }
  body.single .frame svg { border-radius: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<header>
  <h1>A day in paper — six times of day</h1>
  <p>One seeded place, seven paper layers and the sea, one colour formula: depth ramps the time's haze into its ink in OKLCH; each layer keeps a little of its own paper at mid depth</p>
</header>
<div class="grid" id="grid"></div>
<script src="puppets.js"></script>

function disc(k, T) {

    const inner = path(tear(ellipse(D.x + D.r * 0.44, D.y - D.r * 0.2, D.r * 0.86, D.r * 0.86, 56), 311, { jag: 0.9, wander: 4 }));

function stars(T) {

/** the brand's ≋ as the wind: three long paper ribbons, and (in the film) the card it carries */
function wind(k, T, [x0, y0, s], card = false) {
  const out = [];
  // the ≋'s three strips along a gentle arc A → C (in the film: from the writer's mitten up to the card)
  const A = card ? [130, 520] : [x0, y0], C = card ? [x0 - 70, y0 + 40] : [x0 + 540 * s, y0 - 10 * s], B = card ? [560, 600] : [(A[0] + C[0]) / 2, y0 - 70 * s];
  const at = (u) => [(1 - u) ** 2 * A[0] + 2 * (1 - u) * u * B[0] + u * u * C[0], (1 - u) ** 2 * A[1] + 2 * (1 - u) * u * B[1] + u * u * C[1]];
  [0, 1, 2].forEach((i) => {
    const line = [], u0 = 0.06 * i, u1 = 1 - 0.05 * (2 - i);
    for (let q = 0; q <= 90; q++) {
      const u = u0 + ((u1 - u0) * q) / 90, p = at(u), p2 = at(Math.min(1, u + 0.01)), l = Math.hypot(p2[0] - p[0], p2[1] - p[1]) || 1;
      const nx = -(p2[1] - p[1]) / l, ny = (p2[0] - p[0]) / l, off = (i - 1) * 22 * s + Math.sin(u * Math.PI * 2 * (card ? 4 : 3.2) + i * 0.35) * 11 * s;
      line.push([p[0] + nx * off, p[1] + ny * off]);
    }
    out.push(`<path d="${path(tear(ribbon(line, 9 * s, 0.5), 820 + i, { jag: 0.25, wander: 0.5 }))}" fill="${css(mixLab(T.rim, T.accent, 0.22), card ? 0.85 : 0.42)}" filter="url(#thin-${k})"/>`);
  });
  if (card) {
    const cx = x0, cy = y0, w = 86 * s, h = 112 * s, R = 8 * s;
    const body = [[cx - w / 2 + R, cy - h / 2], [cx + w / 2 - R, cy - h / 2], [cx + w / 2, cy - h / 2 + R], [cx + w / 2, cy + h / 2 - R], [cx + w / 2 - R, cy + h / 2], [cx - w / 2 + R, cy + h / 2], [cx - w / 2, cy + h / 2 - R], [cx - w / 2, cy - h / 2 + R]];
    const cover = [[cx - w / 2 + 7 * s, cy - h / 2 + 7 * s], [cx + w / 2 - 7 * s, cy - h / 2 + 7 * s], [cx + w / 2 - 7 * s, cy - h / 2 + 50 * s], [cx - w / 2 + 7 * s, cy - h / 2 + 50 * s]];
    out.push(`<radialGradient id="cardglow-${k}" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(150 * s)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${css([0.95, 0.06, 85], 0.55)}"/><stop offset="0.45" stop-color="${css(T.accent, 0.16)}"/><stop offset="1" stop-color="${css(T.accent, 0)}"/></radialGradient><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(150 * s)}" fill="url(#cardglow-${k})"/>`);
    out.push(`<g transform="rotate(-8 ${f1(cx)} ${f1(cy)})"><path d="${path(tear(poly(body, 5), 851, { jag: 0.3, wander: 0.6 }))}" fill="${css([0.975, 0.01, 80])}" stroke="${css([0.66, 0.09, 45])}" stroke-width="${1.8 * s}" filter="url(#thin-${k})"/>
      <path d="${path(poly(cover, 5))}" fill="${css([0.8, 0.075, 55])}"/><path d="${path(tear(ellipse(cx + 14 * s, cy - h / 2 + 24 * s, 9 * s, 9 * s, 16), 852, { jag: 0.2, wander: 0.4 }))}" fill="${css([0.92, 0.08, 85])}"/>
      ${[0, 1, 2].map((q) => `<path d="M${f1(cx - w / 2 + 9 * s)},${f1(cy + 8 * s + q * 11 * s)}L${f1(cx + w / 2 - (q === 2 ? 30 : 10) * s)},${f1(cy + 8 * s + q * 11 * s)}" stroke="${css([0.45, 0.02, 60], 0.75)}" stroke-width="${1.6 * s}" stroke-linecap="round" filter="url(#graphite-${k})"/>`).join('')}
    </g>`);
  }

/** the nearest paper of all: a few grass blades and seed heads at the bottom corners, darker than the ground */
function fringe(k, T, P, big) {
  const r = rng(1401), c = css([P.ground[0] * 0.7, P.ground[1] * 0.9, P.ground[2]]), out = [];

      const blade = [[x - w / 2, H + 10], [x + lean * 0.5 - w * 0.3, H - h * 0.55], [x + lean, H - h], [x + lean * 0.5 + w * 0.3, H - h * 0.5], [x + w / 2, H + 10]];
      out.push(`<path d="${path(tear(spline(blade, 4), 1410 + i + x0, { jag: 0.4, wander: 0.8 }))}"/>`);
      if (r() < 0.3) out.push(`<path d="${path(tear(ellipse(x + lean, H - h - 6, 4, 9, 14, lean * 0.01), 1450 + i, { jag: 0.4, wander: 0.6 }))}"/>`);
    }
  }
  return `<g fill="${c}" filter="url(#near-${k})">${out.join('')}</g>`;
}

function lanterns(T, n, seed = 505) {

    out.push(`<path d="${path(ellipse(x, y + 1 * s, 3 * s, 4.5 * s, 12))}" fill="${css([0.93, 0.11, 86])}"/>`);

function puppet(k, T, slug, x, groundY, ppu) {

  const own = slug === 'night' && night; // 悄悄 is of the night: it carries its own light, undimmed
  if (own) {
    const cx = x, cy = groundY - p.height * ppu * 0.6, R = p.height * ppu * 0.6;
    halo = `<radialGradient id="hush-${k}" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * 1.6)}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${css([0.9, 0.1, 88], 0)}"/><stop offset="0.5" stop-color="${css([0.9, 0.1, 88], 0.04)}"/><stop offset="0.66" stop-color="${css([0.9, 0.1, 88], 0.26)}"/><stop offset="1" stop-color="${css([0.86, 0.1, 80], 0)}"/></radialGradient>
      <circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R * 1.6)}" fill="url(#hush-${k})"/>
`;
  }
  return `${halo}<g transform="translate(${f1(tx)} ${f1(ty)}) scale(${ppu})" filter="url(#pup${own ? 'self' : ''}-${k})">${parts}</g>`;
}

function frame(k, T, { big = false } = {}) {
  const P = paletteOf(T), PL = PLACE, o = [];
  o.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${T.name}">`);
  o.push(defs(k, T, P));
  o.push(`<rect width="${W}" height="${H}" fill="url(#sky-${k})"/>`);
  o.push(stars(T));
  o.push(disc(k, T));
  o.push(clouds(k, T));
  // the far range, then the nearer peaks with folds of light on the sun's side
  o.push(`<g filter="url(#far-${k})" fill="${css(P.range)}">${PL.range.map((p) => `<path d="${path(tear(poly(p.pts, 8, false).concat([[p.pts[4][0], BASE], [p.pts[0][0], BASE]]), p.seed, { jag: 0.8, wander: 3 }))}"/>`).join('')}</g>`);
  const side = (p) => (T.disc.x < p.cx ? -1 : 1);
  const fold = css(mixLab(P.peaks, T.disc.halo, 0.2), 0.6), shadeFold = css(mixLab(P.peaks, T.ink, 0.12), 0.5);
  o.push(`<g filter="url(#far-${k})">${PL.peaks.map((p) => {
    const body = path(tear(poly(p.pts, 7, false).concat([[p.pts[4][0], BASE], [p.pts[0][0], BASE]]), p.seed, { jag: 0.7, wander: 2.5 }));
    const s = side(p), [L, ls, top, rs, R] = p.pts, foot = [top[0] + s * p.hw * 0.08, HORIZON + 14];
    const lit = s < 0 ? [top, ls, L, foot] : [top, rs, R, foot], dark = s < 0 ? [top, rs, R, foot] : [top, ls, L, foot];
    return `<path d="${body}" fill="${css(P.peaks)}"/><path d="${path(lit)}" fill="${fold}"/><path d="${path(dark)}" fill="${shadeFold}"/>`;
  }).join('')}</g>`);
  // the sea, the disc's reflection cut in strips, slits of light
  o.push(`<rect x="-20" y="${HORIZON}" width="${W + 40}" height="${H}" fill="${css(P.sea)}"/>`);
  const rs = rng(41), refl = T.disc.kind === 'crescent' ? 0.5 : 0.85;
  const rx = T.disc.y < 300 ? T.disc.x - 120 : T.disc.x;
  for (let i = 0; i < 10; i++) {
    const y = HORIZON + 5 + i * 8.5 + rs() * 3, w = T.disc.r * 1.5 * (1 - i * 0.07) * (0.55 + rs() * 0.5), x = rx + (rs() - 0.5) * 34;
    if (T.disc.y < 300 && i > 4) break;
    o.push(`<path d="${path(tear(ribbon([[x - w / 2, y], [x, y + 0.5], [x + w / 2, y]], 3.4), 430 + i, { jag: 0.4, wander: 0.6 }))}" fill="${css(T.disc.c, refl * (1 - i * 0.075))}"/>`);
  }
  for (let i = 0; i < 7; i++) { const y = HORIZON + 26 + i * 12, x = rs() * W; o.push(`<path d="M${f1(x)},${f1(y)}h${f1(50 + rs() * 120)}" stroke="${css(mixLab(P.sea, T.sky[3].slice(1), 0.6), 0.45)}" stroke-width="1.4" stroke-linecap="round"/>`); }
  if (T.mist) o.push(`<path d="${path(tear(ribbon(spline([[-80, 616], [300, 604], [700, 618], [1100, 606], [1680, 614]], 20, false), 34, 0.3), 71, { jag: 1, wander: 6 }))}" fill="${css(T.mist, 0.42)}"/>`);
  // the far shore and the headland, a lighthouse on it
  o.push(`<g filter="url(#far-${k})" fill="${css(P.headland)}"><path d="${path(close(PL.shore, 612))}"/><path d="${path(close(PL.headland, 660))}"/>
    <path d="${path(poly([[1404, 548], [1426, 548], [1422, 486], [1428, 482], [1415, 462], [1402, 482], [1408, 486]], 3))}"/></g>`);
  if (T.beam) o.push(`<path d="M1415,476 L980,412 L990,520 Z" fill="${css(T.accent, 0.1)}"/><circle cx="1415" cy="476" r="11" fill="${css(T.accent, 0.35)}"/><circle cx="1415" cy="476" r="3.8" fill="${css([0.95, 0.08, 90])}"/>`);
  else o.push(`<rect x="1409" y="472" width="12" height="7" fill="${css(mixLab(P.headland, T.disc.c, 0.3))}"/>`);
  // the paper town on its hill
  o.push(`<g filter="url(#cut-${k})" fill="${css(P.town)}"><path d="${path(close(PL.townHill))}"/>${PL.houses.map((h) => `<path d="${path(h.body)}"/>`).join('')}</g>`);
  const roof = css(mixLab(P.town, [P.town[0] - 0.035, 0.1, 38], T.kappa * 0.55));
  o.push(PL.houses.filter((h) => h.roof).map((h) => `<path d="${path(h.roof)}" fill="${roof}"/>`).join(''));
  const lit = css([0.9, 0.12, 84]), unlit = css(mixLab(P.town, T.ink, 0.22));
  o.push(PL.windows.map((w) => (w.on < T.windows ? `<circle cx="${f1(w.x + 3.2)}" cy="${f1(w.y + 4.2)}" r="11" fill="${css(T.accent, 0.13)}"/><rect x="${f1(w.x)}" y="${f1(w.y)}" width="${w.w}" height="${w.h}" rx="1" fill="${lit}"/>` : `<rect x="${f1(w.x)}" y="${f1(w.y)}" width="${w.w}" height="${w.h}" rx="1" fill="${unlit}" opacity="0.5"/>`)).join(''));
  o.push(lanterns(T, T.lanterns + (big && T.lanterns ? 2 : 0)));
  // rolling hills and their trees
  const treeC = css([P.hills[0] - 0.035, P.hills[1] + 0.015, P.hills[2]]);
  o.push(`<g filter="url(#cut-${k})"><path d="${path(close(PL.hills))}" fill="${css(P.hills)}"/>${PL.trees.map((t) => {
    if (t.kind === 'cypress') return `<path d="${path(tear(ellipse(t.x, t.y - 28 * t.s, 7.5 * t.s, 30 * t.s, 22), t.seed, { jag: 0.6, wander: 1.5 }))}" fill="${treeC}"/>`;
    return `<rect x="${f1(t.x - 1.6)}" y="${f1(t.y - 20 * t.s)}" width="3.2" height="${f1(20 * t.s)}" fill="${treeC}"/><path d="${path(tear(ellipse(t.x, t.y - 28 * t.s, 16 * t.s, 14 * t.s, 22), t.seed, { jag: 0.8, wander: 2 }))}" fill="${treeC}"/>`;
  }).join('')}</g>`);
  // the near hill and its lone tree; the low rise on the right
  const trunk = [[204, 620], [208, 566], [214, 524], [226, 488], [238, 470], [246, 474], [234, 494], [224, 530], [220, 570], [222, 620]];
  const canopy = [[240, 420, 74, 50], [178, 444, 50, 36], [302, 448, 54, 36], [250, 390, 46, 32], [206, 410, 40, 28]].map(([x, y, rx, ry], i) => path(tear(ellipse(x, y, rx, ry, 30), 960 + i, { jag: 1.6, wander: 5 })));
  const nearC = css(P.near), canC = css([P.near[0] + 0.035, P.near[1] + 0.012, P.near[2]]);
  o.push(`<g filter="url(#torn-${k})"><path d="${path(close(tear(PL.near, 1201, { jag: 1.2, wander: 4, closed: false })))}" fill="${nearC}"/><path d="${path(close(tear(PL.nearRight, 1202, { jag: 1.2, wander: 4, closed: false })))}" fill="${nearC}"/>
    <path d="${path(tear(spline(trunk, 4), 1203, { jag: 0.5, wander: 1 }))}" fill="${canC}"/>${canopy.map((d) => `<path d="${d}" fill="${canC}"/>`).join('')}</g>`);
  // in the air: birds, the ≋ wind
  o.push(birds(T, P, T.disc.kind === 'sun' ? Math.min(1180, T.disc.x + 150) : 900, Math.min(360, T.disc.y - 140), T.birds + (big ? 2 : 0)));
  if (T.wind) o.push(wind(k, T, big ? [900, 270, 1] : T.wind, big));
  // the ground, and on it the puppets
  const ground = tear(PL.ground, 1301, { jag: 1, wander: 3, closed: false });
  o.push(`<path d="${path(close(ground))}" fill="${css(P.ground)}" filter="url(#torn-${k})"/>`);
  o.push(pencil(PL.groundEdge.filter((_, i) => i % 2 === 0).map((p) => [p[0], p[1] + 12]), 1302, 2, 0.8).map((d) => `<path d="${d}" fill="none" stroke="${css(mixLab(P.ground, T.rim, 0.3), 0.45)}" stroke-width="1.4" filter="url(#graphite-${k})"/>`).join(''));
  const cast = big ? [['tuck', 360], ['card', 600]] : T.cast;
  for (const [slug, x] of cast) o.push(puppet(k, T, slug, x, yAt(PL.groundEdge, x) + 5, big ? 0.48 : 0.45));
  o.push(fringe(k, T, P, big));
  // drifting fibres, near the eye
  const rf = rng(77 + k.length), fib = [];
  for (let i = 0; i < (big ? 12 : 7); i++) { const x = rf() * W, y = 520 + rf() * 330, a = 2 + rf() * 3; fib.push(`<path d="M${f1(x)},${f1(y)}c${f1(a)},${f1(-a)} ${f1(a)},${f1(a)} ${f1(2 * a)},${f1(0)}s${f1(a)},${f1(-a)} ${f1(2 * a)},${f1(0)}" fill="none" stroke="${css(T.rim, 0.32)}" stroke-width="1" stroke-linecap="round" transform="rotate(${f1(rf() * 60 - 30)} ${f1(x)} ${f1(y)})"/>`); }
  o.push(fib.join(''));
  if (!NOGRAIN) o.push(`<rect width="${W}" height="${H}" filter="url(#grain-${k})" opacity="${T.ink[0] < 0.25 ? 0.12 : 0.1}" style="mix-blend-mode:soft-light"/>`);
  o.push(`</svg>`);
  return { svg: o.join(''), P };
}

/* ───────────── contrast: each puppet's paper (and its rim) against the papers behind and under it ───────────── */
const PUPPET_PAPER = { tuck: [0.8, 0.045, 140], tag: [0.82, 0.04, 220], card: [0.84, 0.045, 290], dot: [0.86, 0.1, 95], night: [0.44, 0.06, 260] };
function contrastTable(T, P) {
  const rows = {}, night = T.ink[0] < 0.25;
  for (const [slug, c] of Object.entries(PUPPET_PAPER)) {
    const tint = slug === 'night' && night ? SELF_LIGHT : T.tint;
    const y = lumOfSrgb(srgb(c).map((v, i) => Math.min(1, v * tint[i])));
    rows[slug] = {};
    for (const key of ['sea', 'hills', 'near', 'ground']) rows[slug][key] = +ratio(y, lumOfSrgb(srgb(P[key]))).toFixed(1);
    rows[slug].rimOnNear = +ratio(lumOfSrgb(srgb([0.975, 0.012, 85]).map((v, i) => Math.min(1, v * tint[i]))), lumOfSrgb(srgb(P.near))).toFixed(1);
  }
  return rows;
}

/* ───────────── render ───────────── */

const grid = document.getElementById('grid');
const report = {};
if (view === 'dusk') {
  document.body.classList.add('single');
  grid.innerHTML = `<figure class="frame">${frame('dusk-big', TIMES.dusk, { big: true }).svg}</figure>`;
} else {
  for (const [k, T] of Object.entries(TIMES)) {
    const { svg, P } = frame(k, T);
    const sw = [...T.sky.map(([, L, C, h]) => `<i class="sky" style="background:${css([L, C, h])}"></i>`), '<i class="gap"></i>', ...LAYERS.flatMap((l) => (l.key === 'headland' ? [`<i style="background:${css(P.sea)}"></i>`] : []).concat(`<i style="background:${css(P[l.key])}"></i>`)), '<i class="gap"></i>', `<i class="sky" style="background:${css(T.accent)}"></i>`].join('');
    const fig = document.createElement('figure');
    fig.innerHTML = `<div class="frame">${svg}</div><figcaption><b>${T.name} · ${T.zh}</b><span class="sw">${sw}</span></figcaption>`;
    grid.append(fig);
    report[k] = {
      sky: T.sky.map(([o, L, C, h]) => `${o}: ${fmt([L, C, h])}`),
      layers: Object.fromEntries([...LAYERS.map((l) => [l.key, fmt(P[l.key])]), ['sea', fmt(P.sea)]]),
      haze: fmt(T.haze), ink: fmt(T.ink), disc: fmt(T.disc.c), accent: fmt(T.accent), rim: fmt(T.rim),
      contrast: contrastTable(T, P),
    };
  }
}
window.__report = report;
console.log(JSON.stringify(report));
Promise.all([...document.querySelectorAll('image')].map((im) => new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = new URL(im.getAttribute('href'), location.href).href; }))).then(() => setTimeout(() => { window.__ready = true; }, 300));
</script>
</body>
