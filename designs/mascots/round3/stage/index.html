<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>摺摺登場舞台</title>
<style>
  :root {
    --bg: oklch(96.5% 0.015 75); --surface: oklch(98.8% 0.006 80); --chip: oklch(93.5% 0.018 75);
    --ink: oklch(29% 0.018 60); --muted: oklch(50% 0.02 60); --line: oklch(86% 0.02 70);
    --accent: oklch(58% 0.14 45); --on-accent: oklch(99% 0.005 80); --frame: oklch(25% 0.012 60);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(21% 0.012 60); --surface: oklch(25.5% 0.013 60); --chip: oklch(28% 0.014 60);
      --ink: oklch(92% 0.012 80); --muted: oklch(72% 0.015 70); --line: oklch(36% 0.015 60);
      --accent: oklch(68% 0.13 45); --on-accent: oklch(18% 0.01 60); --frame: oklch(12% 0.008 60);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(21% 0.012 60); --surface: oklch(25.5% 0.013 60); --chip: oklch(28% 0.014 60);
    --ink: oklch(92% 0.012 80); --muted: oklch(72% 0.015 70); --line: oklch(36% 0.015 60);
    --accent: oklch(68% 0.13 45); --on-accent: oklch(18% 0.01 60); --frame: oklch(12% 0.008 60);
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 4px; letter-spacing: .01em; }
  .lede { margin: 0 0 18px; color: var(--muted); font-size: 14px; max-width: 62ch; }
  noscript, .fail { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>摺摺登場舞台</h1>
  <p class="lede">首頁上的紙偶訪客：一次一到兩隻，從畫面邊緣走進來、從卡片後面爬上來或探出頭，做點小事再離開；兩隻遇到時會揮手、一起共振。把滑鼠移到角色身上，牠會看你、揮揮手；點一下會開心跳起來，再點一下就害羞地走掉。</p>
  <div id="app"></div>
  <noscript>這個原型需要 JavaScript。</noscript>
</main>
<script src="stage.bundle.js"></script>
<script>
  (async () => {
    try {
      window.__msp = await MascotStage.mountPrototype(document.getElementById('app'), { base: '', ledges: MascotStage.LEDGES, flags: location.search });
    } catch (err) {
      console.error(err);
      const p = document.createElement('p'); p.className = 'fail'; p.textContent = '原型載入失敗：' + err.message;
      document.getElementById('app').append(p);
    }
  })();
</script>
</body>
</html>
