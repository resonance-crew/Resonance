<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:oklch(96.5% 0.015 75);font:13px 'PingFang TC',sans-serif;color:#665}
.row{display:flex;align-items:flex-end;gap:28px;padding:16px 24px}
img{display:block}
.sil{filter:brightness(0) contrast(10)}
.flip{transform:scaleX(-1)}
.up{transform:scaleY(-1)}
.cap{text-align:center;margin-top:4px}
.night{background:oklch(21% 0.012 60);padding:10px}
</style></head><body>
<div class="row">
 <div><img class="sil" src="../character.svg" width="200" height="200"><div class="cap">剪影 200</div></div>
 <div><img class="sil flip" src="../character.svg" width="200" height="200"><div class="cap">左右翻轉</div></div>
 <div><img class="sil up" src="../character.svg" width="200" height="200"><div class="cap">上下顛倒</div></div>
 <div><img class="sil" src="../character.svg" width="62" height="62"><div class="cap">剪影 48</div></div>
 <div><img src="../character.svg" width="62" height="62"><div class="cap">48</div></div>
 <div><img src="../character.svg" width="124" height="124"><div class="cap">96</div></div>
 <div class="night"><img src="../character.svg" width="200" height="200"></div>
</div>
</body></html>
